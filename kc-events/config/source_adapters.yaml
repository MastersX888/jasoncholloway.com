# Maps approved account_id → ingest adapter.
# adapter: bluesky | rainy_day | writers_place | unbound | nelson | rockhurst_poets
#          artskcgo | kclibrary_events | genealogykc | gkcgensoc | html_generic
#          instagram_harvest | skip
# Instagram: browser-harvested JSON under data/raw_ig/{handle}.json (no Graph API).

defaults:
  confidence_min: 0.6
  bluesky_limit: 40

sources:
  web:rainy-day-books:
    adapter: rainy_day
    url: https://rainydaybooks.com/upcoming-events
  web:writers-place:
    adapter: writers_place
    url: https://thewritersplace.wildapricot.org/Events
  web:writers-place-calendar:
    adapter: writers_place
    url: https://thewritersplace.wildapricot.org/Events
  web:unbound-book-festival:
    adapter: unbound
    url: https://www.unboundbookfestival.com/
  web:nelson-atkins:
    adapter: nelson
    url: https://www.nelson-atkins.org/events/
  web:rockhurst-midwest-poets:
    adapter: rockhurst_poets
    url: https://www.rockhurst.edu/center-arts-letters/midwest-poets-series
  web:artskcgo:
    adapter: artskcgo
    url: https://artskcgo.com/
  web:kclibrary-calendar:
    adapter: kclibrary_events
    url: https://kclibrary.org/events
  web:national-wwi-museum:
    adapter: html_generic
    url: https://www.theworldwar.org/events
  web:kc-museum:
    adapter: html_generic
    url: https://kansascitymuseum.org/events/
  web:jackson-county-historical:
    adapter: html_generic
    url: https://jchs.org/
  web:missouri-valley-special-collections:
    adapter: kclibrary_events
    url: https://kclibrary.org/events
  web:mcpl-midwest-genealogy:
    adapter: html_generic
    url: https://www.mymcpl.org/genealogy
  web:mgc-events:
    adapter: html_generic
    url: https://www.mymcpl.org/genealogy
  web:prosperos-books:
    adapter: html_generic
    url: https://prosperosbookstore.com/
  web:skylark-bookshop:
    adapter: html_generic
    url: https://www.skylarkbookshop.com/
  web:umkc-cockefair:
    adapter: html_generic
    url: https://www.umkc.edu/
  web:artskc:
    adapter: html_generic
    url: https://artskc.org/
  web:visit-kc:
    adapter: html_generic
    url: https://www.visitkc.com/events
  web:kcur:
    adapter: html_generic
    url: https://www.kcur.org/
  web:flatland-kc:
    adapter: html_generic
    url: https://www.flatlandkc.org/
  web:heartland-book-festival:
    adapter: html_generic
    url: https://kclibrary.org/news/2025-08/new-authors-programs-and-partners-%E2%80%94-heartland-book-festival-returns-its-biggest-year
  web:gkc-genealogy-society:
    adapter: gkcgensoc
    url: https://greaterkcgensoc.org/
  web:genealogykc:
    adapter: genealogykc
    url: https://genealogykc.org/
  bluesky:kclibrary.bsky.social:
    adapter: bluesky
    handle: kclibrary.bsky.social
  instagram:kclibrary:
    adapter: instagram_harvest
    handle: kclibrary
  instagram:rainydaybooks:
    adapter: instagram_harvest
    handle: rainydaybooks
  instagram:unboundbookfestival:
    adapter: instagram_harvest
    handle: unboundbookfestival
  instagram:nelsonatkins:
    adapter: instagram_harvest
    handle: nelsonatkins
  instagram:nationalwwimuseum:
    adapter: instagram_harvest
    handle: nationalwwimuseum
