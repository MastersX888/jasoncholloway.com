<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio BeineckeRef Visual Verification</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Beinecke MS 408 · Visual Verification</h1>
      <p class="subtitle">Human confirmation only — suggestions are hints, never auto-saved.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="queue-controls">
        <label>
          Filter
          <select id="filterMode">
            <option value="pending">Pending</option>
            <option value="all">All Voynich</option>
            <option value="verified">Verified (session)</option>
            <option value="skipped">Skipped</option>
          </select>
        </label>
        <input id="searchBox" type="search" placeholder="Search id / title / filename" />
      </div>
      <ul id="queueList" class="queue-list"></ul>
    </aside>

    <section class="workspace">
      <div class="meta" id="meta"></div>

      <div class="toolbar">
        <div class="ref-entry">
          <label for="refInput">Confirmed beineckeRef</label>
          <input id="refInput" type="text" placeholder="e.g. f2v, f68r3, f85v-86r" autocomplete="off" />
        </div>
        <div class="toolbar-actions">
          <button id="btnConfirm" class="primary">Confirm (Enter)</button>
          <button id="btnSkip">Skip (S)</button>
          <button id="btnPrev">← Prev</button>
          <button id="btnNext">Next →</button>
        </div>
      </div>

      <div class="suggestions" id="suggestions"></div>

      <div class="compare-toolbar">
        <label>
          Yale folio
          <select id="yaleSelect"></select>
        </label>
        <label>
          Zoom <input id="zoomRange" type="range" min="50" max="200" value="100" />
          <span id="zoomLabel">100%</span>
        </label>
        <label class="checkbox">
          <input id="overlayMode" type="checkbox" />
          Overlay compare
        </label>
        <label class="checkbox">
          <input id="syncPan" type="checkbox" checked />
          Sync pan
        </label>
        <label>
          Overlay <input id="overlayOpacity" type="range" min="0" max="100" value="50" />
        </label>
        <a id="yaleLink" href="#" target="_blank" rel="noopener">Open in Yale viewer ↗</a>
      </div>

      <div class="panes" id="panes">
        <figure class="pane">
          <figcaption>Local export (E: archive)</figcaption>
          <div class="viewport" data-pane="local">
            <img id="localImg" alt="Local folio export" draggable="false" />
          </div>
        </figure>
        <figure class="pane">
          <figcaption>Yale digital surrogate (MS 408)</figcaption>
          <div class="viewport" data-pane="yale">
            <img id="yaleImg" alt="Yale Beinecke folio" draggable="false" />
            <img id="overlayImg" alt="" class="overlay hidden" draggable="false" />
          </div>
        </figure>
      </div>

      <label class="note-block">
        Reviewer note
        <textarea id="noteInput" rows="2" placeholder="Optional: foldout panel, crop, category concern…"></textarea>
      </label>

      <div class="footer-actions">
        <button id="btnExport">Export patch JSON</button>
        <code id="exportStatus"></code>
      </div>
    </section>
  </main>

  <template id="suggestionTemplate">
    <button type="button" class="chip"></button>
  </template>

  <script src="/app.js"></script>
</body>
</html>
