[app]
name = "Metadata Monitoring Pipeline"
version = "2.0.0"
debug = false

[database]
# Use SQLite for development; swap to postgres:// for production
url = "sqlite+aiosqlite:///./metadata_pipeline.db"
echo = false

[scraping]
request_timeout_seconds = 10
max_concurrent_requests = 10
retry_attempts = 3
retry_backoff_seconds = 2
verify_ssl = true

[audit]
baseline_csv = "C:\\Users\\zh577\\Downloads\\metadata_report.csv"

# Fields to audit and their severity levels
[audit.fields]
title    = "CRITICAL"
author   = "CRITICAL"
pub_date = "CRITICAL"
publisher = "WARNING"

[scheduler]
# Cron expression for automated sweeps (default: nightly at 2 AM UTC)
sweep_cron = "0 2 * * *"
enabled = true

[logging]
level = "INFO"
format = "json"

[alerts]
# Optional Slack webhook for CRITICAL discrepancy alerts
slack_webhook_url = ""
enabled = false
