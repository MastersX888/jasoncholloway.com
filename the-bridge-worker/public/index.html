// Cloud backend — data persists in Cloudflare KV (survives browser cache clears)
const BRIDGE_API = "https://the-bridge.zh5779485.workers.dev";

let sessionToken = null;
try { sessionToken = sessionStorage.getItem("bridge_session"); } catch (e) {}

function setSession(token) {
  sessionToken = token;
  try { sessionStorage.setItem("bridge_session", token); } catch (e) {}
}

function clearSession() {
  sessionToken = null;
  try { sessionStorage.removeItem("bridge_session"); } catch (e) {}
}

function bridgeHeaders() {
  const h = { "Content-Type": "application/json" };
  if (sessionToken) h.Authorization = "Bearer " + sessionToken;
  return h;
}

async function authFetch(path, options = {}) {
  const res = await fetch(BRIDGE_API + path, {
    ...options,
    headers: { ...bridgeHeaders(), ...(options.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  return { res, data };
}

async function fetchAuthStatus() {
  const { data } = await authFetch("/api/bridge/auth/status");
  return data.ok ? data : { users: {}, bootstrapOpen: true };
}

async function fetchAuthMe() {
  const { res, data } = await authFetch("/api/bridge/auth/me");
  if (!res.ok) return null;
  return data.user;
}

async function loginUser(user, password, totpCode) {
  const { res, data } = await authFetch("/api/bridge/auth/login", {
    method: "POST",
    body: JSON.stringify({ user, password, totpCode }),
  });
  if (!res.ok) throw new Error(data.error || "Sign in failed");
  setSession(data.sessionToken);
  return data.user;
}

async function logoutUser() {
  await authFetch("/api/bridge/auth/logout", { method: "POST" });
  clearSession();
}

async function startEnroll(user, password, confirmPassword) {
  const { res, data } = await authFetch("/api/bridge/auth/enroll/start", {
    method: "POST",
    body: JSON.stringify({ user, password, confirmPassword }),
  });
  if (!res.ok) throw new Error(data.error || "Setup failed");
  return data;
}

async function confirmEnroll(user, password, totpCode) {
  const { res, data } = await authFetch("/api/bridge/auth/enroll/confirm", {
    method: "POST",
    body: JSON.stringify({ user, password, totpCode }),
  });
  if (!res.ok) throw new Error(data.error || "Verification failed");
  setSession(data.sessionToken);
  return data.user;
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((ch) => ch.charCodeAt(0)));
}

async function registerBridgePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    return { ok: false, error: "Push not supported in this browser" };
  }
  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return { ok: false, error: "Notification permission denied" };
    const { data } = await authFetch("/api/bridge/push/vapid-public");
    if (!data.ok || !data.publicKey) return { ok: false, error: "Push not configured on server yet" };
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(data.publicKey),
      });
    }
    const { res, data: subData } = await authFetch("/api/bridge/push/subscribe", {
      method: "POST",
      body: JSON.stringify({ subscription: sub.toJSON() }),
    });
    if (!res.ok) return { ok: false, error: subData.error || "Subscribe failed" };
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e.message || "Push registration failed" };
  }
}

async function unregisterBridgePush() {
  await authFetch("/api/bridge/push/subscribe", { method: "DELETE" });
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) await sub.unsubscribe();
  } catch (e) {}
  return { ok: true };
}

function getDateKey() { return new Date().toISOString().slice(0, 10); }
function getDayOfYear() { const now = new Date(); return Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000); }

async function load(key) {
  try {
    const res = await fetch(`${BRIDGE_API}/api/bridge/kv?key=${encodeURIComponent(key)}`, {
      headers: sessionToken ? { Authorization: "Bearer " + sessionToken } : {},
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.value ? JSON.parse(data.value) : null;
  } catch {
    return null;
  }
}

async function save(key, val) {
  try {
    await fetch(`${BRIDGE_API}/api/bridge/kv`, {
      method: "PUT",
      headers: bridgeHeaders(),
      body: JSON.stringify({ key, value: JSON.stringify(val) }),
    });
  } catch (e) {
    console.error("Storage:", e);
  }
}

async function callClaude(messages, system, maxTokens = 1000) {
  try {
    const res = await fetch(`${BRIDGE_API}/api/bridge/claude`, {
      method: "POST",
      headers: bridgeHeaders(),
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: maxTokens, system, messages }),
    });
    const data = await res.json();
    if (!res.ok) return data.error || "Connection issue — please try again.";
    return data.text || "";
  } catch (e) {
    return "Connection issue — please try again.";
  }
}

function buildCounselorSystem(profile) {
  const base = `You are a warm, professional couples communication facilitator embedded in "The Bridge" — a shared dashboard for Jason and Tiffany, a couple navigating different work schedules (Tiffany works evenings). Your role:

- You are NOT a therapist. You are a skilled communication facilitator drawing on Gottman Method, attachment theory, and nonviolent communication.
- Be warm, direct, occasionally playful. No clinical jargon unless explaining a concept.
- When given check-in data or conversation context, offer specific, actionable observations — not generic advice.
- Highlight patterns with curiosity, not judgment. Use "I notice..." and "I'm curious about..." framing.
- If you see signs of contempt, stonewalling, or persistent disconnection, name it gently and suggest professional support.
- Celebrate wins explicitly.
- Keep responses to 2-4 paragraphs unless asked to go deeper.`;

  if (!profile || Object.keys(profile).length === 0) return base;

  const profileContext = Object.entries(profile)
    .filter(([, v]) => v?.summary)
    .map(([k, v]) => {
      const section = PROFILE_SECTIONS.find(s => s.key === k);
      return `\n## ${section?.label || k}\n${v.summary}`;
    }).join("\n");

  if (!profileContext) return base;

  return `${base}

━━━━━━━━━━━━━━━━━━━━━━━━━━━
RELATIONSHIP PROFILE (synthesized from uploads by Jason & Tiffany)
This is your primary context for understanding this couple. Reference it naturally — don't recite it back.
━━━━━━━━━━━━━━━━━━━━━━━━━━━
${profileContext}
━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
}

async function extractInsights(rawText, ingestType, existingProfile) {
  const existingContext = existingProfile
    ? Object.entries(existingProfile)
        .filter(([, v]) => v?.summary)
        .map(([k, v]) => `${k}: ${v.summary}`)
        .join("\n")
    : "None yet.";

  const system = `You are an expert relationship analyst. Given raw content submitted by one partner in a couple (Jason and Tiffany), extract structured insights to build a relationship profile. Be empathetic, non-judgmental, and specific. Return ONLY valid JSON — no markdown, no preamble.`;

  const prompt = `Content type: ${ingestType}
Raw content: """
${rawText.slice(0, 4000)}
"""

Existing profile context:
${existingContext}

Extract insights and return this exact JSON shape:
{
  "origin": "new insight about their story/history, or null if none",
  "patterns": "new insight about communication patterns, or null if none",
  "tensions": "new insight about friction points or triggers, or null if none",
  "strengths": "new insight about relationship strengths, or null if none",
  "dreams": "new insight about shared goals/dreams, or null if none",
  "individuals": "new insight about individual personalities/needs, or null if none",
  "summary": "2-3 sentence overall synthesis of this specific upload",
  "tags": ["array", "of", "3-5", "thematic", "keywords"]
}

Only include fields where you found real evidence. Be specific — use names, quote themes, identify concrete patterns.`;

  try {
    const raw = await callClaude([{ role: "user", content: prompt }], system, 1200);
    const cleaned = raw.replace(/```json|```/g, "").trim();
    return JSON.parse(cleaned);
  } catch (e) {
    return { summary: "Upload processed but structured extraction failed. Raw content retained.", tags: [] };
  }
}

function mergeIntoProfile(existing, extracted, uploadMeta) {
  const merged = { ...existing };
  PROFILE_SECTIONS.forEach(({ key }) => {
    if (extracted[key]) {
      const prev = merged[key] || { summary: "", sources: [] };
      merged[key] = {
        summary: prev.summary
          ? `${prev.summary}\n\n[${uploadMeta.date}] ${extracted[key]}`
          : `[${uploadMeta.date}] ${extracted[key]}`,
        sources: [...(prev.sources || []), uploadMeta],
        lastUpdated: Date.now(),
      };
    }
  });
  return merged;
}

function TheBridge() {
  const [currentUser, setCurrentUser] = useState(null);
  const [authStatus, setAuthStatus] = useState(null);
  const [authScreen, setAuthScreen] = useState(null); // "login" | "setup"
  const [tab, setTab] = useState("home");
  const [checkIns, setCheckIns] = useState({});
  const [notes, setNotes] = useState([]);
  const [challenge, setChallenge] = useState(null);
  const [chatHistory, setChatHistory] = useState([]);
  const [profile, setProfile] = useState({});
  const [uploads, setUploads] = useState([]);
  const [cycleConfig, setCycleConfig] = useState(() => (window.BridgeCycles ? window.BridgeCycles.defaultProfiles() : {}));
  const [loading, setLoading] = useState(true);

  const loadAppData = useCallback(async () => {
    const [ci, n, ch, chat, prof, ups, cc] = await Promise.all([
      load("bridge:checkins"),
      load("bridge:notes"),
      load("bridge:challenge"),
      load("bridge:chat"),
      load("bridge:profile"),
      load("bridge:uploads"),
      load("bridge:cycle-config"),
    ]);
    setCheckIns(ci || {});
    setNotes(n || []);
    setChallenge(ch || null);
    setChatHistory(chat || []);
    setProfile(prof || {});
    setUploads(ups || []);
    setCycleConfig(cc || (window.BridgeCycles ? window.BridgeCycles.defaultProfiles() : {}));
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const [status, me] = await Promise.all([fetchAuthStatus(), fetchAuthMe()]);
        setAuthStatus(status);
        if (me) {
          setCurrentUser(me);
          await loadAppData();
        }
      } catch (e) {
        console.error("Bridge init:", e);
        setAuthStatus({ users: {}, bootstrapOpen: true });
      } finally {
        setLoading(false);
      }
    })();
  }, [loadAppData]);

  const handleUserSelect = (name) => {
    clearSession();
    setCurrentUser(name);
    const enrolled = authStatus?.users?.[name]?.enrolled;
    setAuthScreen(enrolled ? "login" : "setup");
  };

  const handleAuthSuccess = async (user) => {
    setCurrentUser(user);
    setAuthScreen(null);
    setLoading(true);
    await loadAppData();
    setLoading(false);
  };

  const handleLogout = async () => {
    await logoutUser();
    setCurrentUser(null);
    setAuthScreen(null);
    setCheckIns({});
    setNotes([]);
    setChallenge(null);
    setChatHistory([]);
    setProfile({});
    setUploads([]);
    const status = await fetchAuthStatus();
    setAuthStatus(status);
  };

  const saveCheckIn = useCallback(async (user, data) => {
    const key = `${getDateKey()}:${user}`;
    const updated = { ...checkIns, [key]: { ...data, ts: Date.now() } };
    setCheckIns(updated);
    await save("bridge:checkins", updated);
  }, [checkIns]);

  const addNote = useCallback(async (note) => {
    const updated = [note, ...notes].slice(0, 100);
    setNotes(updated);
    await save("bridge:notes", updated);
  }, [notes]);

  const setActiveChallenge = useCallback(async (ch) => {
    setChallenge(ch);
    await save("bridge:challenge", ch);
  }, []);

  const updateChat = useCallback(async (msgs) => {
    setChatHistory(msgs);
    await save("bridge:chat", msgs.slice(-40));
  }, []);

  const updateProfile = useCallback(async (newProfile) => {
    setProfile(newProfile);
    await save("bridge:profile", newProfile);
  }, []);

  const addUpload = useCallback(async (upload) => {
    const updated = [upload, ...uploads].slice(0, 50);
    setUploads(updated);
    await save("bridge:uploads", updated);
  }, [uploads]);

  const updateCycleConfig = useCallback(async (newConfig) => {
    setCycleConfig(newConfig);
    await save("bridge:cycle-config", newConfig);
  }, []);

  if (loading) {
    return (
      <div style={s.loadWrap}>
        <div style={s.loadTitle}>⊶ The Bridge</div>
        <div style={s.loadSub}>Loading your shared space<LoadingDots /></div>
      </div>
    );
  }

  if (!currentUser || authScreen) {
    if (authScreen === "login") {
      return (
        <LoginView
          user={currentUser}
          onSuccess={handleAuthSuccess}
          onBack={() => { setCurrentUser(null); setAuthScreen(null); }}
        />
      );
    }
    if (authScreen === "setup") {
      return (
        <SetupView
          user={currentUser}
          onSuccess={handleAuthSuccess}
          onBack={() => { setCurrentUser(null); setAuthScreen(null); }}
        />
      );
    }
    return (
      <UserSelect
        onSelect={handleUserSelect}
        checkIns={checkIns}
        profile={profile}
        authStatus={authStatus}
      />
    );
  }

  const partner = currentUser === "Jason" ? "Tiffany" : "Jason";
  const profileScore = Object.values(profile).filter(v => v?.summary).length;

  return (
    <div style={s.shell}>
      <header style={s.header}>
        <div style={s.headerLeft}>
          <span style={s.logo}>⊶</span>
          <span style={s.brandName}>The Bridge</span>
          {profileScore > 0 && (
            <span style={s.profilePill}>{profileScore}/6 profile</span>
          )}
        </div>
        <button style={s.userBadge} onClick={handleLogout}>
          {currentUser === "Jason" ? "🌙" : "☀️"} {currentUser} · Sign out
        </button>
      </header>

      <main style={s.main}>
        {tab === "home" && <HomeView currentUser={currentUser} partner={partner} checkIns={checkIns} notes={notes} challenge={challenge} profile={profile} onTabChange={setTab} />}
        {tab === "checkin" && <CheckInView currentUser={currentUser} partner={partner} checkIns={checkIns} onSave={saveCheckIn} />}
        {tab === "cycles" && <CyclesView currentUser={currentUser} partner={partner} checkIns={checkIns} cycleConfig={cycleConfig} onUpdateConfig={updateCycleConfig} />}
        {tab === "notes" && <NotesView currentUser={currentUser} partner={partner} notes={notes} onAdd={addNote} />}
        {tab === "talk" && <TalkView currentUser={currentUser} partner={partner} chatHistory={chatHistory} onUpdateChat={updateChat} checkIns={checkIns} profile={profile} />}
        {tab === "profile" && <ProfileView currentUser={currentUser} partner={partner} profile={profile} uploads={uploads} onUpdateProfile={updateProfile} onAddUpload={addUpload} />}
        {tab === "grow" && <GrowView challenge={challenge} onSetChallenge={setActiveChallenge} />}
      </main>

      <nav style={s.nav}>
        {[
          { id: "home", icon: "⌂", label: "Home" },

  const startSetup = async (e) => {

function ProfileView({ currentUser, partner, profile, uploads, onUpdateProfile, onAddUpload }) {
  const [subTab, setSubTab] = useState("overview");
  const [ingestType, setIngestType] = useState("texts");
  const [rawText, setRawText] = useState("");
  const [authoredBy, setAuthoredBy] = useState(currentUser);
  const [processing, setProcessing] = useState(false);
  const [processStatus, setProcessStatus] = useState("");
  const [expandedSection, setExpandedSection] = useState(null);
  const fileRef = useRef(null);

  const profileScore = Object.values(profile).filter(v => v?.summary).length;

  const handleProcess = async () => {
    if (!rawText.trim()) return;
    setProcessing(true);
    setProcessStatus("Reading your content...");

    try {
      setProcessStatus("Extracting relationship insights...");
      const extracted = await extractInsights(rawText, ingestType, profile);

      setProcessStatus("Updating relationship profile...");
      const uploadMeta = {
        id: Date.now(),
        type: ingestType,
        authoredBy,
        date: new Date().toLocaleDateString(),
        preview: rawText.slice(0, 120) + (rawText.length > 120 ? "..." : ""),
        summary: extracted.summary,
        tags: extracted.tags || [],
        ts: Date.now(),
      };

      const newProfile = mergeIntoProfile(profile, extracted, uploadMeta);
      await onUpdateProfile(newProfile);
      await onAddUpload(uploadMeta);

      setRawText("");
      setProcessStatus("✓ Profile updated successfully");
      setTimeout(() => { setProcessStatus(""); setSubTab("overview"); }, 2000);
    } catch (err) {
      setProcessStatus("Something went wrong. Try again.");
      setTimeout(() => setProcessStatus(""), 3000);
    }
    setProcessing(false);
  };

  return (
    <div style={s.viewWrap}>
      <h2 style={s.viewTitle}>Relationship Profile</h2>
      <p style={s.viewSub}>Your private context vault — the more you add, the better your counselor knows you.</p>

      <div style={s.filterRow}>
        {[["overview", "◈ Profile"], ["ingest", "⊕ Add Content"], ["uploads", `⊞ Uploads (${uploads.length})`]].map(([id, label]) => (

      {subTab === "overview" && (

              <div style={{ ...s.progressFill, width: `${(profileScore / 6) * 100}%`, background: profileScore >= 4 ? `linear-gradient(90deg, ${c.sage}, ${c.teal})` : `linear-gradient(90deg, ${c.lavender}, ${c.accent})` }} />

function LiveChatPanel({ currentUser, partner }) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([]);
  const [online, setOnline] = useState([]);
  const [typingUser, setTypingUser] = useState(null);
  const [connected, setConnected] = useState(false);
  const [input, setInput] = useState("");
  const [unread, setUnread] = useState(0);
  const wsRef = useRef(null);
  const scrollRef = useRef(null);
  const typingTimer = useRef(null);
  const lastSeenRef = useRef(0);
  const openRef = useRef(false);

  useEffect(() => { openRef.current = open; if (open) setUnread(0); }, [open]);

  useEffect(() => {
    if (!sessionToken || !currentUser) return;
    let closed = false;
    let retry = 0;

    const connect = () => {
      const wsUrl = BRIDGE_API.replace(/^http/i, "ws") + "/api/bridge/live/ws?token=" + encodeURIComponent(sessionToken);
      const ws = new WebSocket(wsUrl);
      wsRef.current = ws;

      ws.onopen = () => { setConnected(true); retry = 0; };
      ws.onclose = () => {
        setConnected(false);
        if (!closed) setTimeout(connect, Math.min(1000 * (2 ** retry++), 15000));
      };
      ws.onmessage = (ev) => {
        let data;
        try { data = JSON.parse(ev.data); } catch (e) { return; }
        if (data.type === "init") {
          setMessages(data.messages || []);
          setOnline(data.online || []);
          lastSeenRef.current = (data.messages || []).slice(-1)[0]?.ts || Date.now();
          return;
        }
        if (data.type === "msg") {
          setMessages((prev) => [...prev, data]);
          if (!openRef.current && data.user !== currentUser) setUnread((n) => n + 1);
          if (data.user !== currentUser) setTypingUser(null);
          return;
        }
        if (data.type === "presence") setOnline(data.online || []);
        if (data.type === "typing") setTypingUser(data.active ? data.user : null);
      };
    };

    connect();
    return () => { closed = true; wsRef.current?.close(); };
  }, [currentUser]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, typingUser, open]);

  const partnerOnline = online.includes(partner);

  const sendTyping = (active) => {
    if (wsRef.current?.readyState === WebSocket.OPEN) {
      wsRef.current.send(JSON.stringify({ type: "typing", active }));
    }
  };

  const handleInput = (value) => {
    setInput(value);
    sendTyping(true);
    clearTimeout(typingTimer.current);
    typingTimer.current = setTimeout(() => sendTyping(false), 1200);
  };

  const sendMessage = () => {
    const text = input.trim();
    if (!text || wsRef.current?.readyState !== WebSocket.OPEN) return;
    wsRef.current.send(JSON.stringify({ type: "msg", text }));
    setInput("");
    sendTyping(false);
  };

  const partnerEmoji = partner === "Jason" ? "🌙" : "☀️";

  if (!open) {
    return (
      <button style={s.liveFab} onClick={() => setOpen(true)} title={"Chat with " + partner}>
        <span style={{ fontSize: 22 }}>{partnerEmoji}</span>
        {unread > 0 && <span style={s.liveBadge}>{unread > 9 ? "9+" : unread}</span>}
        {partnerOnline && <span style={s.liveFabDot} />}
      </button>
    );
  }

  return (
    <div style={s.livePanel}>
      <div style={s.liveHeader}>
        <div style={s.liveHeaderLeft}>
          <span style={{ fontSize: 20 }}>{partnerEmoji}</span>
          <div>
            <div style={s.liveHeaderName}>{partner}</div>
            <div style={s.liveHeaderStatus}>
              <span style={{ ...s.liveStatusDot, background: partnerOnline ? c.sage : c.textMuted }} />
              {partnerOnline ? "Active now" : connected ? "Offline" : "Reconnecting…"}
            </div>
          </div>
        </div>
        <button style={s.liveMinBtn} onClick={() => setOpen(false)} title="Minimize">—</button>
      </div>

      <div style={s.liveMessages} ref={scrollRef}>
        {messages.length === 0 && (
          <div style={s.liveEmpty}>
            <div style={{ fontSize: 28, marginBottom: 8 }}>💬</div>
            <div style={{ fontWeight: 600, marginBottom: 4 }}>Your private line</div>
            <div style={{ fontSize: 13, color: c.textMuted, lineHeight: 1.5 }}>
              Message {partner} in real time — like Messenger, but just for the two of you.
            </div>
          </div>
        )}
        {messages.map((msg) => {
          const mine = msg.user === currentUser;
          return (
            <div key={msg.id} style={{ ...s.liveRow, justifyContent: mine ? "flex-end" : "flex-start" }}>
              <div style={{ maxWidth: "78%" }}>
                {!mine && <div style={s.liveMsgName}>{msg.user}</div>}
                <div style={{ ...s.liveBubble, ...(mine ? s.liveBubbleMine : s.liveBubbleTheirs) }}>
                  {msg.text}
                </div>
                <div style={{ ...s.liveMsgTime, textAlign: mine ? "right" : "left" }}>
                  {new Date(msg.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                </div>
              </div>
            </div>
          );
        })}
        {typingUser && typingUser !== currentUser && (
          <div style={{ ...s.liveRow, justifyContent: "flex-start" }}>
            <div style={{ ...s.liveBubble, ...s.liveBubbleTheirs, opacity: 0.85 }}>
              {typingUser} is typing<LoadingDots />
            </div>
          </div>
        )}
      </div>

      <div style={s.liveInputRow}>
        <input
          style={s.liveInput}
          placeholder={"Message " + partner + "…"}
          value={input}
          onChange={(e) => handleInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); sendMessage(); } }}
        />
        <button
          style={{ ...s.liveSendBtn, opacity: input.trim() ? 1 : 0.45 }}
          onClick={sendMessage}
          disabled={!input.trim()}
          title="Send"
        >
          ↑
        </button>
      </div>
    </div>
  );
}

function TrendChart({ series, width, height, showHormones }) {
  const W = width || 340;
  const H = height || 168;
  const pad = { t: 14, r: 10, b: 30, l: 34 };
  const w = W - pad.l - pad.r;
  const h = H - pad.t - pad.b;
  const pts = (series || []).filter((d) => d.baseline != null || d.actual != null);
  if (!pts.length) return <p style={s.muted}>Check in daily to build your 30-day trend.</p>;

  const x = (i) => pad.l + (i / Math.max(pts.length - 1, 1)) * w;
  const y = (v) => pad.t + h - (Math.min(100, Math.max(0, v || 0)) / 100) * h;

  const pathFor = (key) => {
    let d = "";
    pts.forEach((pt, i) => {
      const val = pt[key];
      if (val == null) return;
      d += (d && !d.endsWith("Z") ? "" : "") + `${i === 0 || !d ? "M" : " L"} ${x(i).toFixed(1)} ${y(val).toFixed(1)}`;
    });
    return d;
  };

  const last = pts[pts.length - 1];
  const labelStep = Math.max(1, Math.floor(pts.length / 6));

  return (
    <div>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block" }}>
        {[0, 25, 50, 75, 100].map((v) => (
          <g key={v}>
            <line x1={pad.l} y1={y(v)} x2={W - pad.r} y2={y(v)} stroke={c.border} strokeWidth={0.5} />
            <text x={pad.l - 5} y={y(v) + 3} fill={c.textMuted} fontSize={8} textAnchor="end">{v}</text>
          </g>
        ))}
        {pts.some((d) => d.baseline != null) && (
          <path d={pathFor("baseline")} fill="none" stroke={c.lavender} strokeWidth={1.6} strokeDasharray="5 4" opacity={0.85} />
        )}
        {showHormones && pts.some((d) => d.estrogen != null) && (
          <path d={pathFor("estrogen")} fill="none" stroke={c.rose} strokeWidth={1.2} opacity={0.55} />
        )}
        {showHormones && pts.some((d) => d.progesterone != null) && (
          <path d={pathFor("progesterone")} fill="none" stroke={c.teal} strokeWidth={1.2} opacity={0.55} />
        )}
        {showHormones && pts.some((d) => d.testosterone != null) && (
          <path d={pathFor("testosterone")} fill="none" stroke={c.sage} strokeWidth={1.2} opacity={0.65} />
        )}
        {pts.some((d) => d.actual != null) && (
          <path d={pathFor("actual")} fill="none" stroke={c.accent} strokeWidth={2.2} />
        )}
        {pts.map((d, i) => (
          i % labelStep === 0 || i === pts.length - 1 ? (
            <text key={d.date} x={x(i)} y={H - 8} fill={c.textMuted} fontSize={7} textAnchor="middle">{d.date.slice(5)}</text>
          ) : null
        ))}
        {last?.moonEmoji && (
          <text x={x(pts.length - 1)} y={pad.t - 2} fontSize={12} textAnchor="middle">{last.moonEmoji}</text>
        )}
      </svg>
      <div style={s.chartLegend}>
        <span style={{ color: c.accent }}>● Mood (logged)</span>
        <span style={{ color: c.lavender }}>— Clinical baseline</span>
        {showHormones === "female" && <span style={{ color: c.rose }}>— Estrogen</span>}
        {showHormones === "male" && <span style={{ color: c.sage }}>— Testosterone</span>}
      </div>
    </div>
  );
}

          <p style={{ fontSize: 14, color: c.textMuted, lineHeight: 1.6, margin: "0 0 14px" }}>You finished "{challenge.title}" — well done, both of you.</p>
          <button style={s.primaryBtn} onClick={() => onSetChallenge(null)}>Choose a New Challenge</button>
        </div>
      )}

      {(!challenge || showAll || isComplete) && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {CHALLENGES.map((ch, i) => (
            <div key={i} style={s.card}>
              <h3 style={{ fontSize: 16, fontFamily: font.display, margin: "0 0 6px", fontWeight: 600 }}>{ch.title}</h3>
              <p style={{ fontSize: 13, color: c.textMuted, lineHeight: 1.5, margin: "0 0 12px" }}>{ch.desc}</p>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 12, color: c.lavender }}>{ch.days} days</span>
                <button style={s.startBtn} onClick={() => { onSetChallenge({ ...ch, startDate: Date.now() }); setShowAll(false); }}>Start</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {challenge && !isComplete && !showAll && (
        <button style={s.secondaryBtn} onClick={() => setShowAll(true)}>Browse All Challenges</button>
      )}
    </div>
  );
}
