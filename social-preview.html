const IMG_BASE = "public/social/imagen";
const heroFiles = {
  1: "slot1-frequency-hero.png",
  2: "slot2-cymatics-hero.png",
  3: "slot3-kansas-city-hero.png",
  4: "slot4-ars-notoria-hero.png",
  5: "slot5-stone-remembers-hero.png",
  6: "slot6-three-factions-hero.png",
  7: "slot7-unreleased-hero.png"
};
const pinFiles = {
  1: "pinterest-slot1-frequency.png",
  2: "pinterest-slot2-cymatics.png",
  3: "pinterest-slot3-kansas-city.png",
  4: "pinterest-slot4-ars-notoria.png",
  5: "pinterest-slot5-stone-remembers.png",
  6: "pinterest-slot6-three-factions.png",
  7: "pinterest-slot7-unreleased.png"
};

const approvals = {};
SLOTS.forEach(s => approvals[s.num] = "pending");

function escapeHtml(t) {
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderSlot(s) {
  const igImgs = Array.from({length: s.igSlides}, (_, i) => {
    const n = String(i+1).padStart(2,"0");
    return `<div class="img-card"><img class="carousel-img" src="${IMG_BASE}/slot${s.num}/ig-slot${s.num}-slide${n}.png" alt="Slide ${i+1}" loading="lazy"><div class="img-label">Slide ${i+1}</div></div>`;
  }).join("");
  
  const heroImg = `<div class="img-card"><img class="hero-img" src="${IMG_BASE}/slot${s.num}/${heroFiles[s.num]}" alt="Hero" loading="lazy"><div class="img-label">Hero (X / FB / Bluesky)</div></div>`;
  const pinImg = `<div class="img-card"><img class="pinterest-img" src="${IMG_BASE}/slot${s.num}/${pinFiles[s.num]}" alt="Pinterest" loading="lazy"><div class="img-label">Pinterest</div></div>`;

  return `
<div class="slot" id="slot-${s.num}" data-slot="${s.num}">
  <div class="slot-header">
    <div>
      <h2><span class="slot-num">SLOT ${s.num}</span> ${escapeHtml(s.title)}${s.live ? '<span class="live-badge">LIVE</span>' : ''}</h2>
      <a class="essay-link" href="https://jasoncholloway.com${s.url}" target="_blank">Essay ${s.essay} &rarr; jasoncholloway.com${s.url}</a>
    </div>
    <div class="approval-controls">
      <button class="btn-approve" onclick="setApproval(${s.num},'approved')">Approve</button>
      <button class="btn-reject" onclick="setApproval(${s.num},'rejected')">Reject</button>
      <span class="status-label" id="status-${s.num}" style="color:var(--pending);border:1px solid var(--pending)">PENDING</span>
    </div>
  </div>
  <div class="slot-body">
    
    <div class="platform-section">
      <div class="platform-label">Instagram Carousel (${s.igSlides} slides)</div>
      <div class="images-row">${igImgs}</div>
      <div class="carousel-labels">${s.igCaptions.map((c,i) => `<span>${i+1}. ${escapeHtml(c)}</span>`).join("")}</div>
      <div style="margin-top:12px">
        <div class="copy-label">INSTAGRAM CAPTION</div>
        <div class="copy-block">${escapeHtml(s.ig)}</div>
      </div>
    </div>

    <hr class="divider">

    <div class="platform-section">
      <div class="platform-label">Hero Image (X / Facebook / Bluesky)</div>
      <div class="images-row">${heroImg}${pinImg}</div>
    </div>

    <hr class="divider">

    <div class="platform-section">
      <div class="platform-label">Post Copy by Platform</div>
      <div class="platform-grid">
        <div>
          <div class="copy-label">X (TWITTER) &mdash; POST A</div>
          <div class="copy-block">${escapeHtml(s.x_a)}</div>
          <div class="copy-label" style="margin-top:12px">X (TWITTER) &mdash; POST B</div>
          <div class="copy-block">${escapeHtml(s.x_b)}</div>
        </div>
        <div>
          <div class="copy-label">BLUESKY</div>
          <div class="copy-block">${escapeHtml(s.bluesky)}</div>
        </div>
        <div>
          <div class="copy-label">FACEBOOK</div>
          <div class="copy-block">${escapeHtml(s.fb)}</div>
        </div>
        <div>
          <div class="copy-label">PINTEREST</div>
          <div class="copy-block">Pin image: ${pinFiles[s.num]}
Blog link: jasoncholloway.com${s.url}
Board: Masters X Trilogy</div>
        </div>
      </div>
    </div>

  </div>
</div>`;
}

function updateCounts() {
  const vals = Object.values(approvals);
  document.getElementById("count-approved").textContent = vals.filter(v=>v==="approved").length + " Approved";
  document.getElementById("count-pending").textContent = vals.filter(v=>v==="pending").length + " Pending";
  document.getElementById("count-rejected").textContent = vals.filter(v=>v==="rejected").length + " Rejected";
}

function setApproval(num, status) {
  approvals[num] = status;
  const label = document.getElementById("status-" + num);
  const colors = {approved: "var(--approve)", rejected: "var(--reject)", pending: "var(--pending)"};
  label.textContent = status.toUpperCase();
  label.style.color = colors[status];
  label.style.borderColor = colors[status];
  const slot = document.getElementById("slot-" + num);
  slot.style.borderColor = status === "approved" ? "var(--approve)" : status === "rejected" ? "var(--reject)" : "var(--border)";
  updateCounts();
  localStorage.setItem("mx-approvals", JSON.stringify(approvals));
}

function exportApprovals() {
  const lines = SLOTS.map(s => `Slot ${s.num}: ${s.title} — ${approvals[s.num].toUpperCase()}`);
  const text = "Masters X Social Media Approvals\n" + new Date().toISOString() + "\n\n" + lines.join("\n");
  const blob = new Blob([text], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "social-approvals.txt";
  a.click();
}

function init() {
  const saved = localStorage.getItem("mx-approvals");
  if (saved) { try { Object.assign(approvals, JSON.parse(saved)); } catch {} }
  document.getElementById("main").innerHTML = SLOTS.map(renderSlot).join("");
  SLOTS.forEach(s => { if (approvals[s.num] !== "pending") setApproval(s.num, approvals[s.num]); });
  updateCounts();
}

init();
</script>
</body>
</html>
