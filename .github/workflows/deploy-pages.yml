name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, cursor/ops-dashboard-3e24]
  workflow_dispatch:

concurrency:
  group: deploy-jasoncholloway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export (production — no /ops)
        run: npm run build

      - name: Remove private ops dashboard from deploy output
        run: rm -rf out/ops

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy out --project-name=jasoncholloway --branch=main
