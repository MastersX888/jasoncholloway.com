name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, cursor/ops-dashboard-3e24]
  workflow_dispatch:

concurrency:
  group: deploy-jasoncholloway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export (production — no /ops)
        run: npm run build

      - name: Remove private ops dashboard from deploy output
        run: rm -rf out/ops

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=jasoncholloway --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}

      - name: Purge Cloudflare cache
        run: |
          ZONE_ID=$(curl -sf "https://api.cloudflare.com/client/v4/zones?name=jasoncholloway.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Cache purged for jasoncholloway.com"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN }}
