[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "metadata-monitor"
version = "2.0.0"
description = "Production-grade metadata audit and monitoring pipeline"
requires-python = ">=3.11"
dependencies = [
    # Web framework & serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",

    # Async HTTP (replaces requests + urllib3)
    "httpx>=0.27",

    # Async ORM + database drivers
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",           # SQLite async driver (dev)
    "asyncpg>=0.29",             # PostgreSQL async driver (prod)

    # HTML parsing
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # Structured logging
    "structlog>=24.0",

    # Scheduling (optional — for in-process cron)
    "apscheduler>=3.10",

    # Pydantic v2 (used by FastAPI)
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",    # for TestClient
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
