version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Switch to postgres service below for production-like local dev
      DATABASE_URL: "sqlite+aiosqlite:///./metadata_pipeline.db"
      # DATABASE_URL: "postgresql+asyncpg://metadata:metadata@db:5432/metadata"
    volumes:
      - .:/app            # Live reload in dev
      - ./data:/app/data  # Persist DB outside container
    depends_on:
      - db
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional PostgreSQL — uncomment DATABASE_URL above to use
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metadata
      POSTGRES_PASSWORD: metadata
      POSTGRES_DB: metadata
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
